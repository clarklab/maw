<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="MAW — a game about talking with your mouth full.">
<title>MAW</title>

<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="MAW">
<meta property="og:title" content="MAW — a game about talking with your mouth full">
<meta property="og:description" content="You are the mouth. Dinner in Dalmatia. Let the story out — keep the food in.">
<meta property="og:url" content="https://maw-game.netlify.app/">
<meta property="og:image" content="https://maw-game.netlify.app/assets/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="View from inside a giant open mouth: teeth, tongue and a teetering cherry tomato framing a sunlit Adriatic harbour town, with the title MAW.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MAW — a game about talking with your mouth full">
<meta name="twitter:description" content="You are the mouth. Dinner in Dalmatia. Let the story out — keep the food in.">
<meta name="twitter:image" content="https://maw-game.netlify.app/assets/brand/og.jpg">

<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <!-- vignette / breath overlays -->
  <div id="vignette"></div>
  <div id="redflash"></div>
  <div id="bullet-vignette"></div>

  <!-- edge-glow cues: gold = a word needs out, red = food at the lips -->
  <div id="cue-word"><span>OPEN&nbsp;&middot;&nbsp;LET&nbsp;THE&nbsp;WORD&nbsp;OUT</span></div>
  <div id="cue-food"><span>BITE&nbsp;DOWN!</span></div>

  <canvas id="lasso"></canvas>
  <canvas id="lane"></canvas>

  <!-- DEFEND YOURSELF bonus round: juice on the lens + the call to arms -->
  <div id="splats"></div>
  <div id="defend-banner" class="hidden">
    <div class="db-title">DEFEND&nbsp;YOURSELF!</div>
    <div class="db-sub">circle&nbsp;to&nbsp;block&nbsp;&middot;&nbsp;swipe&nbsp;to&nbsp;dodge</div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="story-ribbon"><span id="story-text"></span><span id="story-caret">&nbsp;</span></div>
    <div id="hud-row">
      <div id="manners" title="Manners"></div>
      <div id="score">0</div>
    </div>
    <div id="chapter-toast" class="hidden"></div>
    <div id="callout" class="hidden"></div>
    <div id="hint">TAP&nbsp;TO&nbsp;BITE&nbsp;&middot;&nbsp;OPEN&nbsp;TO&nbsp;SPEAK</div>
    <div id="stuck-tip" class="hidden"></div>
    <div id="breath-meter"><div id="breath-fill"></div></div>
  </div>

  <!-- Title screen -->
  <div id="title-screen">
    <div class="title-inner">
      <p class="kicker">A&nbsp;DINNER&nbsp;STORY</p>
      <h1>MAW</h1>
      <p class="subtitle">talking with your mouth full</p>
      <p class="triad">tap&nbsp;&middot;&nbsp;hold&nbsp;&middot;&nbsp;listen</p>
      <button id="start-btn">OPEN&nbsp;WIDE</button>
      <p class="fineprint">headphones recommended</p>
    </div>
  </div>

  <!-- Story-voiced explainer, three taps deep -->
  <div id="explainer" class="hidden">
    <div class="exp-inner">
      <p id="exp-text"></p>
      <canvas id="exp-lane" class="hidden"></canvas>
      <p class="exp-tap">tap to continue</p>
    </div>
  </div>

  <!-- End screens -->
  <div id="end-screen" class="hidden">
    <div class="title-inner">
      <h2 id="end-title"></h2>
      <p id="end-sub"></p>
      <div id="end-story"></div>
      <div id="end-score"></div>
      <button id="retry-btn">ONCE&nbsp;MORE,&nbsp;WITH&nbsp;FEELING</button>
    </div>
  </div>

  <div id="loading"><span>salivating&hellip;</span></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
